name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Smoke test built package
        run: |
          node -e "import('./dist/index.js').then(m => { if (typeof m.GatewayClient !== 'function') process.exit(1) })"
          node -e "if (typeof require('./dist/index.cjs').GatewayClient !== 'function') process.exit(1)"

  integration:
    name: Sandbox integration tests
    needs: test
    runs-on: ubuntu-latest
    env:
      GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
      GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        if: env.GATEWAY_API_KEY != ''
